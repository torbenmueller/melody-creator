<div class="container center-h">
	<div class="form-signin">
		<div class="text-center mb-32">
			<div class="icon-container">
				<i class="fas fa-unlock-alt sign-in-icon"></i>
			</div>
			<h1 class="h3">Reset Password</h1>
			<p class="white-color">We will help you to reset your password</p>
		</div>
		<form (submit)="onResetPassword(resetPasswordForm)" #resetPasswordForm="ngForm" class="features-box bg-color-2 mb-32">
			<div>
				<label for="floatingEmail" class="form-label">Email address</label>
				<input name="email" type="email" ngModel class="form-control" id="floatingEmail" placeholder="E-Mail" #emailInput="ngModel" required>
				@if (!emailInput.valid && emailInput.touched) {
					<span class="password-hints">Please enter a valid email!</span>
				}
			</div>
			<button class="w-100 btn btn-lg btn-success" type="submit" [disabled]="isLoading">Reset Password</button>
			@if (isLoading) {
				<div class="center-h">
					<div class="spinner-border" role="status">
						<span class="sr-only">Loading...</span>
					</div>
				</div>
			}
		</form>
		<div class="text-center">
			<a class="forgot-password" routerLink="/auth/login">Back to login</a>
		</div>
	</div>
</div>
