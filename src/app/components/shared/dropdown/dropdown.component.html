<div class="custom-dropdown" [class.open]="isOpen" [attr.aria-label]="ariaLabel">
  <div class="selected-value"
  (click)="onToggleClick($event)"
  (keydown)="onToggleKeydown($event)"
       tabindex="0"
       role="button"
       aria-haspopup="listbox"
       [attr.aria-expanded]="isOpen">
    {{ selectedOption }}
    <span class="dropdown-arrow" [class.open]="isOpen" aria-hidden="true">&#9662;</span>
  </div>
  @if (isOpen) {
    <ul class="dropdown-list" role="listbox">
      @for (option of options; track trackByFn($index, option)) {
        <li 
          (click)="onOptionClick($event, option)"
          [class.selected]="option === selectedOption"
          role="option"
          [attr.aria-selected]="option === selectedOption"
          [attr.data-value]="option"
          (keydown)="onOptionKeydown($event, option)"
          tabindex="0">
          {{ option }}
        </li>
      }
    </ul>
  }
</div>
