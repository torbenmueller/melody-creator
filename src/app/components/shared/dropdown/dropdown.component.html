<div class="custom-dropdown" [class.open]="isOpen" (click)="$event.stopPropagation()">
  <div class="selected-value" (click)="toggleDropdown()" tabindex="0" [attr.aria-expanded]="isOpen">
    {{ selectedOption ? displayFn(selectedOption) : placeholder }}
    <span class="dropdown-arrow" [class.open]="isOpen">&#9662;</span>
  </div>
  @if (isOpen) {
    <ul class="dropdown-list" role="listbox">
      @for (option of options; track trackByFn($index, option)) {
        <li 
          (click)="selectOption(option)"
          [class.selected]="option === selectedOption"
          role="option"
          [attr.aria-selected]="option === selectedOption"
          [attr.data-value]="displayFn(option)">
          {{ displayFn(option) }}
        </li>
      }
    </ul>
  }
</div>
