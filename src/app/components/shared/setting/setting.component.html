<div class="settings-box">
	<div>
		<p class="subheadline inline-block mb-0 white-color transparent">
			{{ category }}
		</p>
		<i class="{{ icon }} ms-2 purple-color"></i>
	</div>
	<p class="settings-box-header">{{ settings.scale }}</p>
	<app-dropdown [options]="options" [selectedOption]="settings.scale" (selectedOptionChange)="handleSelectedOptionChange($event)">
		placeholder="Select a {{ category }}" aria-label="{{ category }} selector">
	</app-dropdown>
</div>
